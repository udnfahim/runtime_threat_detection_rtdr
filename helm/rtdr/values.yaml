replicaCount: 2

image:
  repository: ghcr.io/your-org/rtdr
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rtdr
  SPRING_DATASOURCE_USERNAME: rtdr_user
  SPRING_DATASOURCE_PASSWORD: rtdr_pass
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379
  SECURITY_TELEMETRY_AGENT-TOKEN: change-me-secure-token
  SECURITY_OAUTH2_JWK-SET-URI: https://auth.example.com/.well-known/jwks.json

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
