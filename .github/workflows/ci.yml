name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Run unit tests
        run: mvn -B test

      - name: Build Docker image
        if: ${{ github.event_name == 'push' }}
        run: |
          docker build -t ${GITHUB_REPOSITORY}:latest .

      - name: Publish Docker image (optional)
        if: ${{ secrets.DOCKER_REGISTRY && github.event_name == 'push' }}
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$PASSWORD" | docker login $REGISTRY -u $USERNAME --password-stdin
          docker tag ${GITHUB_REPOSITORY}:latest $REGISTRY/${GITHUB_REPOSITORY}:$GITHUB_SHA
          docker push $REGISTRY/${GITHUB_REPOSITORY}:$GITHUB_SHA
