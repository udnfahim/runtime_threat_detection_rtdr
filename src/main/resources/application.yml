spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rtdr}
    username: ${SPRING_DATASOURCE_USERNAME:rtdr_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rtdr_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        ddl-auto: none
    show-sql: false
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  oauth2:
    jwk-set-uri: ${SECURITY_OAUTH2_JWK-SET-URI:https://auth.example.com/.well-known/jwks.json}
  telemetry:
    agent-token: ${SECURITY_TELEMETRY_AGENT-TOKEN:change-me-secure-token}

server:
  servlet:
    context-path: /
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

