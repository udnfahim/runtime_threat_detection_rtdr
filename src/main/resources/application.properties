spring.application.name=runtime_threat_detection_rtdr
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rtdr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rtdr_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rtdr_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

security.oauth2.jwk-set-uri=${SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8080/default-certs}
security.telemetry.agent-token=${SECURITY_TELEMETRY_AGENT_TOKEN:change-me-secure-token}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.redis.enabled=true
management.health.db.enabled=true